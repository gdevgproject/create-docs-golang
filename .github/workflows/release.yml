name: Quality and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.asset }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            asset: codedocs_windows_amd64.exe
            windows_gui: true
          - goos: windows
            goarch: arm64
            asset: codedocs_windows_arm64.exe
            windows_gui: true
          - goos: darwin
            goarch: arm64
            asset: codedocs_darwin_arm64
            windows_gui: false
          - goos: linux
            goarch: amd64
            asset: codedocs_linux_amd64
            windows_gui: false

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="v0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi

          if [[ "${version}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            resource_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.0"
          else
            echo "Unsupported version: ${version}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "resource_version=${resource_version}" >> "${GITHUB_OUTPUT}"

      - name: Generate versioned Windows resources
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          resource_version="${{ steps.version.outputs.resource_version }}"
          sed -i "s/1\.8\.1\.0/${resource_version}/g" winres/winres.json
          rm -f "cmd/codedocs/rsrc_windows_${{ matrix.goarch }}.syso"
          go run github.com/tc-hib/go-winres@v0.3.3 make \
            --in winres/winres.json \
            --arch "${{ matrix.goarch }}" \
            --out cmd/codedocs/rsrc

      - name: Build release binary
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          ldflags="-s -w -X codedocs/internal/config.Version=${VERSION}"
          if [[ "${{ matrix.windows_gui }}" == "true" ]]; then
            ldflags="-H=windowsgui ${ldflags}"
          fi
          go build -trimpath -ldflags="${ldflags}" \
            -o "dist/${{ matrix.asset }}" ./cmd/codedocs

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create SHA-256 checksums
        working-directory: dist
        run: sha256sum codedocs_* > SHA256SUMS.txt

      - name: Attest release binaries
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: CodeDocs ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            dist/codedocs_windows_amd64.exe
            dist/codedocs_windows_arm64.exe
            dist/codedocs_darwin_arm64
            dist/codedocs_linux_amd64
            dist/SHA256SUMS.txt
