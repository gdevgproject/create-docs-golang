<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodePulse AI — Next-Gen Code Context Engine</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ══ SIDEBAR ══ -->
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
      </svg>
      <div class="brand-text">
        <span class="brand-title">CodePulse AI</span>
        <span class="brand-badge" id="app-version">v1.4.3</span>
      </div>
    </div>

    <!-- SECTION 1: TARGET PATH & CORE ACTIONS -->
    <div class="sidebar-section">
      <div class="input-group">
        <label class="input-label" for="path-input">Target Project Path</label>
        <input type="text" id="path-input" class="input-control" placeholder="e.g. D:/projects/my-app or /var/www/project">
      </div>

      <div class="btn-group vertical">
        <button class="btn btn-primary btn-block" id="btn-gen">⚡ Generate Context</button>
        <button class="btn btn-secondary btn-block" id="btn-struct">🌳 Directory Tree</button>
      </div>
    </div>

    <hr class="divider">

    <!-- SECTION 2: OUTPUT MODE -->
    <div class="sidebar-section">
      <label class="input-label">Generation Mode</label>
      <div class="mode-selector" id="mode-selector">
        <label class="mode-btn">
          <input type="radio" name="gen-mode" value="full">
          <span>📄 Full Content</span>
        </label>
        <label class="mode-btn">
          <input type="radio" name="gen-mode" value="stats" checked>
          <span>📊 Stats Only</span>
        </label>
      </div>
    </div>

    <hr class="divider">

    <!-- SECTION 3: UTILITY TOOLS -->
    <div class="sidebar-section">
      <label class="input-label">Developer Tools</label>
      <div class="btn-group">
        <button class="btn btn-ghost" id="btn-counter" style="flex:1;">🧮 Token Counter</button>
        <button class="btn btn-ghost" id="btn-exclusions" style="flex:1;">🚫 Ignored List</button>
      </div>
    </div>

    <hr class="divider">

    <!-- SECTION 4: BOOKMARKS -->
    <div class="sidebar-section flex-1">
      <div class="bm-header">
        <div class="bm-title-group">
          <label class="input-label">Saved Bookmarks</label>
          <span class="bm-count" id="bm-count">0</span>
        </div>
        <div class="bm-tools-row">
          <button class="btn btn-ghost btn-xs" id="btn-export-bm" title="Export bookmarks backup JSON">📤 Backup</button>
          <button class="btn btn-ghost btn-xs" id="btn-import-bm" title="Import bookmarks backup JSON">📥 Restore</button>
          <input type="file" id="import-file-input" accept=".json" style="display:none;">
        </div>
      </div>

      <div class="bm-add-row">
        <input type="text" id="bm-note" class="input-control" placeholder="Project label...">
        <button class="btn btn-secondary btn-icon" id="btn-add-bm" title="Save current path">＋</button>
      </div>

      <div class="bookmarks-area" id="bm-list">
        <div class="bm-empty">No bookmarks saved yet</div>
      </div>
    </div>

    <hr class="divider">

    <!-- SECTION 5: FOOTER VERSION & IN-PLACE UPDATER -->
    <div class="version-row">
      <span class="version-text" id="ver-info">CodePulse AI v1.5.0</span>
      <button class="btn btn-ghost sm" id="btn-manual-check" style="font-size:0.7rem; padding:2px 8px;" title="Check GitHub for Updates">🔄 Check Update</button>
      <button class="btn-update-badge" id="btn-check-update" style="display:none;" title="Click to update application">✨ Update Available</button>
    </div>
  </aside>

  <!-- ══ MAIN CONTENT ══ -->
  <main class="main">
    <div class="preview-container">
      <header class="preview-header">
        <div class="preview-left">
          <span class="preview-title">DOCUMENT PREVIEW</span>
          <span class="status-badge badge-idle" id="file-badge">Ready</span>
          
          <div class="stats-cards" id="stats-cards" style="display:none;">
            <div class="stat-card">
              <span class="stat-lbl">FILES</span>
              <span class="stat-val" id="stat-files">–</span>
            </div>
            <div class="stat-card">
              <span class="stat-lbl">LINES</span>
              <span class="stat-val" id="stat-lines">–</span>
            </div>
            <div class="stat-card" id="card-tokens">
              <span class="stat-lbl">TOKENS</span>
              <span class="stat-val" id="stat-tokens">–</span>
            </div>
            <div class="stat-card">
              <span class="stat-lbl">SIZE</span>
              <span class="stat-val" id="stat-size">–</span>
            </div>
            <div class="stat-card">
              <span class="stat-lbl">TIME</span>
              <span class="stat-val" id="stat-time">–</span>
            </div>
            <div class="stat-card" id="card-date" title="Exact local generation timestamp">
              <span class="stat-lbl">LOCAL TIME</span>
              <span class="stat-val" id="stat-date">–</span>
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="action-btn ghost" id="btn-load" style="display:none">📄 Load Content</button>
          <button class="action-btn ghost" id="btn-copy" disabled>📋 Copy Docs</button>
          <a href="#" id="btn-download" class="action-btn primary" disabled>⬇ Download .md</a>
        </div>
      </header>

      <div class="editor-wrapper">
        <!-- HIGH-PERFORMANCE VIRTUAL PREVIEW CONTROL BANNER -->
        <div class="virtual-banner" id="virtual-banner" style="display:none;">
          <div class="v-banner-left">
            <span class="v-pulse-icon">⚡</span>
            <span class="v-banner-text" id="v-banner-text">High-Performance Fast Preview Mode</span>
          </div>
          <div class="v-banner-actions">
            <button class="action-btn ghost sm" id="btn-render-all">📄 Load All Lines (Async)</button>
            <button class="action-btn ghost sm" id="btn-stop-render" style="display:none; color:var(--accent-red); border-color:var(--accent-red);">⏸ Stop Rendering</button>
          </div>
        </div>

        <textarea id="editor" class="code-editor" readonly placeholder="Documentation XML output will appear here after clicking Generate..."></textarea>

        <!-- PROGRESS OVERLAY -->
        <div class="overlay-status" id="status-panel">
          <div class="overlay-top">
            <div class="overlay-title">
              <span class="pulse-dot"></span>
              <span>Generating Codebase Docs...</span>
            </div>
            <span class="overlay-pct" id="percent-text">0%</span>
          </div>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progress-fill"></div>
          </div>
          <div class="overlay-sub">
            <span class="overlay-speed" id="speed-text"></span>
            <span class="overlay-log" id="log-text">Initializing worker pool...</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ══ DIALOG / MODAL ══ -->
  <div class="modal-overlay" id="modal-dialog" style="display:none;">
    <div class="modal-box">
      <div class="modal-head">
        <span id="modal-title">Modal Title</span>
        <div class="modal-actions">
          <button class="btn btn-secondary sm" id="btn-copy-modal">Copy</button>
          <button class="btn btn-ghost sm" id="btn-close-modal">✕ Close</button>
        </div>
      </div>
      <div class="modal-body" id="modal-content"></div>
    </div>
  </div>

  <!-- ══ HISTORY TIMELINE MODAL ══ -->
  <div class="modal-overlay" id="history-modal" style="display:none;">
    <div class="modal-box modal-lg">
      <div class="modal-head">
        <span id="history-modal-title">📜 Scan History Timeline</span>
        <div class="modal-actions">
          <button class="btn btn-ghost sm text-danger" id="btn-clear-history">🗑️ Clear History</button>
          <button class="btn btn-ghost sm" id="btn-close-history-modal">✕ Close</button>
        </div>
      </div>
      <div class="modal-body" id="history-modal-content"></div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
